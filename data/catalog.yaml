policies:
  - id: shift
    title: Смена и переработка
    text: Смена длится 8 часов работы. Подача техники на объект входит в цену смены. Каждый час сверх 8 часов оплачивается по ставке переработки, она указана у каждой машины. Вся техника сдаётся с оператором, топливо входит в цену.
  - id: discounts
    title: Скидки
    text: При аренде одной машины от 5 смен подряд скидка 5%, от 10 смен подряд скидка 10%. Других скидок нет. Индивидуальные условия обсуждает только менеджер.
  - id: delivery
    title: Доставка тяжёлой техники
    text: Мини-экскаватор, самосвал и автокран приезжают своим ходом, доставка не нужна. Экскаватор-погрузчик и каток везём тралом. Трал по Москве в пределах МКАД стоит 4500 ₽ в одну сторону, за МКАД добавляется 120 ₽ за каждый километр от МКАД.
  - id: payment
    title: Оплата и документы
    text: Юрлица и ИП платят по счёту безналом, физлица наличными или переводом. Новые клиенты вносят предоплату 50% до подачи техники. Заключаем договор, после работы даём акт и путевой лист.
  - id: cancel
    title: Отмена заказа
    text: Отменить заказ бесплатно можно не позже чем за 12 часов до подачи. Если отменить позже, клиент оплачивает 30% стоимости смены.
  - id: region
    title: Где работаем
    text: Работаем в Москве и Московской области в радиусе 100 км от МКАД. Дальше не выезжаем.
  - id: booking
    title: Как заказать
    text: Чтобы забронировать технику, менеджер уточняет адрес объекта, дату и время подачи и вид работ, затем присылает договор и счёт. Бронь подтверждает только менеджер.
