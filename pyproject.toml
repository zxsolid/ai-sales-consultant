[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-ai-consultant"
version = "0.1.0"
description = "ИИ-консультант по аренде спецтехники для чатов Авито: отвечает по прайсу, не выдумывает, зовёт менеджера"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.33.0",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "rank-bm25==0.2.2",
    "pyyaml==6.0.4",
    "pydantic-settings==2.16.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "respx==0.23.1", "ruff==0.17.6"]

[tool.setuptools]
packages = ["app", "app.channels", "eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/agent.py" = ["E501"]  # текст промпта
